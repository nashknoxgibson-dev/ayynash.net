baseURL = 'https://ayynash.net'
languageCode = 'en-us'
title = 'Nash Gibson'

[module]
  [[module.imports]]
    path = "github.com/hugo-sid/hugo-blog-awesome"

[params]
  sitename = 'Nash Gibson'
  defaultColor = 'dark'
  description = 'Plex server, media requests, and server status updates.'
  mainSections = ['posts']

  # TMDB artwork for the home page rails. The posters are fetched at BUILD
  # time, so the key never reaches the browser — which also means it must NOT
  # be written here: this repo is public. Leave it empty and pass the key as
  # an environment variable instead; Hugo maps HUGO_PARAMS_* onto params:
  #
  #   local:            HUGO_PARAMS_TMDBKEY=<v3 key> hugo server
  #   Cloudflare Pages: Settings -> Variables and Secrets ->
  #                     HUGO_PARAMS_TMDBKEY = <v3 key>
  #
  # With no key the tiles use the generated placeholder art and the build
  # still succeeds.
  tmdbKey = ''
  tmdbSize = 'w342'   # w185 | w342 | w500 | original

[params.webmanifest]
  theme_color = '#000000'
  background_color = '#000000'

# ---------------------------------------------------------------------------
# Service URLs — change these in ONE place and every button on the site updates.
# ---------------------------------------------------------------------------
[params.services]
  wizarr    = 'https://invite.ayynash.net/'  # Wizarr root = the "enter your invite code" screen
  seerr     = 'https://seerr.ayynash.net'    # Jellyseerr/Overseerr — request movies & shows
  plexWatch = 'https://app.plex.tv/desktop'  # Plex web player
  plexApps  = 'https://www.plex.tv/media-server-downloads/#plex-app'
  contact   = 'https://discord.gg/ayynash'   # where people go when they need help

[params.author]
  name = 'Nash Gibson'
  intro = 'Nash Gibson'
  # Short line under your name. Keep it to a handful of words.
  tagline = "beep boop, boop boop boop beep beep."
  # The main bio paragraph. Edit freely — this is the most "you" text on the site.
  description = "I'm Nash. This site is mainly used as a redirect for my Plex Server, I don't have important stuff here (for now). Socials below if you care :p"

[params.logo]
  path = "/images/logo.png"
  alt = "Nash Gibson logo"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/nashknoxgibson-dev"

[[params.socialIcons]]
  name = "instagram"
  url = "https://instagram.com/ayenash"

[[params.socialIcons]]
  name = "x"
  url = "https://x.com/notaynash"

[[params.socialIcons]]
  name = "youtube"
  url = "https://www.youtube.com/@AyyNash727"

[[params.socialIcons]]
  name = "discord"
  url = "https://discord.gg/ayynash"

[outputs]
  home = ['HTML']
  section = ['HTML']
  taxonomy = ['HTML']
  term = ['HTML']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
  identifier = "join"
  name = "Join"
  url = "/join/"
  weight = 10

[[menu.main]]
  identifier = "updates"
  name = "Updates"
  url = "/posts/"
  weight = 20
